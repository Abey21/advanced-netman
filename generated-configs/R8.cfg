hostname R8

username admin privilege 15 role network-admin secret admin

management api http-commands
   no shutdown
management api gnmi
   transport grpc default
management api netconf
   transport ssh default

snmp-server community public ro


interface et1
   no switchport
   ip address 10.202.0.2
   no shutdown
!
interface et3
   no switchport
   ip address 10.201.0.1
   no shutdown
!


ip routing
ipv6 unicast-routing



router ospf 1
   network 10.202.0.0 area 20
   max-lsa 12000
!

router ospfv3
   address-family ipv6
   redistribute bgp
!


end