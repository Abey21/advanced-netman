hostname R8

username admin privilege 15 role network-admin secret admin

management api http-commands
   no shutdown
management api gnmi
   transport grpc default
management api netconf
   transport ssh default

snmp-server community public ro

vlan 
   name None

interface et1
   switchport mode routed
   ip address 10.202.0.2interface et3
   switchport mode routed
   ip address 10.201.0.1
interface Vlan
!

ip routing
ipv6 unicast-routing

ip route None None
ipv6 route None None

router ospf None
   network 10.202.0.0 0.0.0.0 area 20
   max-lsa 12000

router ospfv3
   address-family ipv6
redistribute bgp
end