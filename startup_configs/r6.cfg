hostname R6
!
ip routing
ipv6 unicast-routing
!
interface Ethernet1
 no switchport
 ip address 10.90.0.2/30
 ipv6 address 5001::2/64
 ipv6 ospf 10 area 0
!
interface Ethernet2
 no switchport
 ip address 10.110.0.1/30
 ipv6 address 6001::1/64
 ipv6 ospf 10 area 0
!
interface Ethernet3
 no switchport
 ip address 10.100.0.15/24
 no shutdown
!
router ospf 1
 network 10.90.0.0 0.0.0.3 area 10
 network 10.110.0.0 0.0.0.3 area 10
 redistribute rip
!
ipv6 router ospf 10
 redistribute rip RIPng include-connected
!
router rip
 version 2
 network 10.110.0.0
 redistribute ospf 
!
username admin privilege 15 secret admin
