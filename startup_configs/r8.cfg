!
hostname R8
!
ip routing
ipv6 unicast-routing
!
username admin privilege 15 secret admin
!
interface Ethernet1
 description LINK_TO_R2
 no switchport
 ip address 10.202.0.2/30
 ipv6 address 5201::2/64
 no shutdown
!
interface Ethernet2
 description MGMT_VIA_S5 (DHCP / ZTP)
 no switchport
 ip address dhcp
 no shutdown
!
interface Ethernet3
 description LINK_TO_S6_FOR_HOSTS
 no switchport
 ip address 10.201.0.1/24
 ipv6 address 6201::1/64
 no shutdown
!
router ospf 20
 network 10.202.0.0/30 area 0.0.0.20
 network 10.201.0.0/24 area 0.0.0.20
!
router ospfv3 20
 router-id 8.8.8.8
!
line vty
 login local
 transport input ssh
!
end
